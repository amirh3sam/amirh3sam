<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="100%" role="img" aria-label="System status: online. Current mode: build, test, automate. Next objective: keep learning.">
  <defs>
    <filter id="sg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="sgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00f7ff" stroke-opacity="0.06"/>
    </pattern>
    <linearGradient id="srule" x1="0" x2="1">
      <stop offset="0" stop-color="#00f7ff"/>
      <stop offset="0.5" stop-color="#ff00ff"/>
      <stop offset="1" stop-color="#00ff41"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="818" height="198" rx="10" fill="#05080f" stroke="#00f7ff" stroke-opacity="0.55"/>
  <rect x="1" y="1" width="818" height="198" rx="10" fill="url(#sgrid)"/>

  <circle cx="36" cy="34" r="5" fill="#00ff41" filter="url(#sg)">
    <animate attributeName="opacity" values="1;0.15;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="54" y="39" font-family="Courier New, monospace" font-size="13" font-weight="bold" letter-spacing="2" fill="#00ff41">SYSTEM ONLINE</text>
  <text x="784" y="39" font-family="Courier New, monospace" font-size="12" fill="#6b7a8f" text-anchor="end">amirhesamtech.com</text>
  <line x1="36" y1="52" x2="784" y2="52" stroke="#00f7ff" stroke-opacity="0.18"/>

  <text x="36" y="86" font-family="Courier New, monospace" font-size="14" fill="#6b7a8f">SYSTEM STATUS</text>
  <text x="250" y="86" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#00ff41">ONLINE</text>

  <text x="36" y="114" font-family="Courier New, monospace" font-size="14" fill="#6b7a8f">CURRENT MODE</text>
  <text x="250" y="114" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#00f7ff">BUILD // TEST // AUTOMATE</text>

  <text x="36" y="142" font-family="Courier New, monospace" font-size="14" fill="#6b7a8f">NEXT OBJECTIVE</text>
  <text x="250" y="142" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#ff00ff">KEEP LEARNING</text>

  <line x1="36" y1="160" x2="784" y2="160" stroke="#00f7ff" stroke-opacity="0.18"/>

  <text x="410" y="182" font-family="Courier New, monospace" font-size="13" font-weight="bold" letter-spacing="2.5" fill="#ff00ff" text-anchor="middle" filter="url(#sg)">
    AUTOMATE // TEST // BUILD // DEPLOY // REPEAT
    <animate attributeName="fill-opacity" values="1;0.45;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <rect x="1" y="196" width="818" height="3" rx="1.5" fill="url(#srule)"/>
</svg>
